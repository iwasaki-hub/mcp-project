name: Validate Vite React Client

on:
  pull_request:
    paths:
      - "Client/**"
      - ".github/workflows/validate-client.yml"
  push:
    branches: [main]
    paths:
      - "Client/**"
      - ".github/workflows/validate-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
